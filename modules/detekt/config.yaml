build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    # complexity: 2
    # LongParameterList: 1
    # style: 1
    # comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  # when writing own rules with new properties, exclude the property path e.g.: 'my_rule_set,.*>.*>[my_property]'
  excludes: ''

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true


comments:
  active: true

complexity:
  active: true
  CognitiveComplexMethod: 
    active: true
    threshold: 15
  NamedArguments: 
    active: true
    threshold: 1
  # for compose
  LongParameterList:
    active: true
    functionThreshold: 99
    ignoreDefaultParameters: true
  # TODO: ViewModelあたりのUIのイベントが多くなるクラスも考慮して考える
  TooManyFunctions:
    active: false
    ignoreAnnotatedFunctions: ['Preview']
  LongMethod:
    active: false

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  ObjectExtendsThrowable: 
    active: true

naming:
  active: true
  # for compose
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*'


performance:
  active: true

potential-bugs:
  active: true
  CastNullableToNonNullableType: 
    active: true
  CastToNullableType: 
    active: true
  Deprecation: 
    active: true
  DontDowncastCollectionTypes: 
    active: true
  ElseCaseInsteadOfExhaustiveWhen: 
    active: true
    ignoredSubjectTypes: []
  ExitOutsideMain: 
    active: true
  ImplicitUnitReturnType: 
    active: true
  LateinitUsage: 
    active: true
  NullCheckOnMutableProperty: 
    active: true
  NullableToStringCall: 
    active: true
  PropertyUsedBeforeDeclaration: 
    active: true
  UnconditionalJumpStatementInLoop: 
    active: true
  UnnecessaryNotNullCheck: 
    active: true

style:
  active: true
  BracesOnIfStatements: 
    active: true
    singleLine: 'never'
    multiLine: 'always'
  BracesOnWhenStatements: 
    active: true
    singleLine: 'necessary'
    multiLine: 'consistent'
  CanBeNonNullable:
    active: false
  CascadingCallWrapping: 
    active: true
    includeElvis: true
  ClassOrdering: 
    active: true
  CollapsibleIfStatements: 
    active: true
  DoubleNegativeLambda: 
    active: true
    negativeFunctions:
      - reason: 'Use `takeIf` instead.'
        value: 'takeUnless'
      - reason: 'Use `all` instead.'
        value: 'none'
    negativeFunctionNameParts:
      - 'not'
      - 'non'
  EqualsOnSignatureLine: 
    active: true
  ExplicitCollectionElementAccessMethod: 
    active: true
  ExplicitItLambdaParameter: 
    active: true
  ExpressionBodySyntax: 
    active: true
    includeLineWrapping: false
  ForbiddenAnnotation: 
    active: true
  ForbiddenImport: 
    active: true
  ForbiddenMethodCall: 
    active: true
  ForbiddenSuppress: 
    active: true
    rules: []
  ForbiddenComment:
    allowedPatterns: 'TODO*'
  MandatoryBracesLoops: 
    active: true
  MultilineLambdaItParameter: 
    active: true
  NoTabs: 
    active: true
  NullableBooleanCheck: 
    active: true
  OptionalUnit: 
    active: true
  PreferToOverPairSyntax: 
    active: true
  SpacingBetweenPackageAndImports: 
    active: true
  StringShouldBeRawString: 
    active: true
    maxEscapedCharacterCount: 2
    ignoredCharacters: []
  TrailingWhitespace: 
    active: true
  ReturnCount:
    active: false # 早期return(複数)は可読性を損なうものではなく、むしろ処理を抜けたほうが読みやすくなるので許可
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 5 # 分解宣言に限度はあると思うが、著しく可読性を損なうものでなければよい
  # for compose
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true 
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview']
  UnusedPrivateMember:
    active: false
    ignoreAnnotated: ['Preview']


TwitterCompose:
  CompositionLocalAllowlist:
    active: true
    # You can optionally define a list of CompositionLocals that are allowed here
    # allowedCompositionLocals: LocalSomething,LocalSomethingElse
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
    # You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
      # You can optionally add your own composables here
      # contentEmitters: MyComposable,MyOtherComposable
  MutableParams:
    active: true
  ComposableNaming:
    active: true
    # You can optionally disable the checks in this rule for regex matches against the composable name (e.g. molecule presenters)
    # allowedComposableFunctionNames: .*Presenter,.*MoleculePresenter
  ComposableParamOrder:
    active: true
  PreviewNaming:
    active: true
  PreviewPublic:
    active: true
    # You can optionally disable that only previews with @PreviewParameter are flagged
    # previewPublicOnlyIfParams: false
  RememberMissing:
    active: true

  # 案件によってはKotlinx Immutable Collectionsは使用されていないため一旦オフにする
  UnstableCollections:
    active: false

  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
